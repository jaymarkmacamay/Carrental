<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DriveEase PH - Premium Car Rental Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .hero-banner {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(30, 58, 138, 0.85)), url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1400&q=80');
            background-size: cover;
            background-position: center;
            color: white;
            border-radius: 20px;
            padding: 70px 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card-custom { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transition: transform 0.2s; }
        .card-custom:hover { transform: translateY(-3px); }
        .badge-status { font-size: 0.85rem; padding: 6px 12px; border-radius: 30px; }
        .navbar-brand-custom { font-size: 1.5rem; font-weight: 700; letter-spacing: 0.5px; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand navbar-brand-custom text-primary" href="#" onclick="navigateTo('welcome')"><i class="fa-solid fa-car-side text-warning me-2"></i>DriveEase <span class="text-white">PH</span></a>
            <div id="nav-user-section"></div>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- FLASH MESSAGES -->
        <div id="alert-container"></div>

        <!-- APP CONTAINER -->
        <div id="app-view"></div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // --- INITIALIZE STORAGE & DEFAULT ACCOUNTS (ENSURES ADMIN & STAFF ALWAYS EXIST) ---
        function initStorage() {
            let users = [];
            try {
                const stored = localStorage.getItem('users');
                if (stored) {
                    users = JSON.parse(stored);
                }
            } catch (e) {
                users = [];
            }

            let adminFound = false;
            let staffFound = false;

            users.forEach(u => {
                if (u.email && u.email.trim().toLowerCase() === 'admin@carrental.com') adminFound = true;
                if (u.email && u.email.trim().toLowerCase() === 'staff@carrental.com') staffFound = true;
            });

            if (!adminFound) {
                users.push({
                    id: 'admin_default',
                    name: 'System Admin',
                    email: 'admin@carrental.com',
                    password: 'admin123',
                    role: 'admin',
                    contact: '',
                    address: '',
                    id_image: ''
                });
            }

            if (!staffFound) {
                users.push({
                    id: 'staff_default',
                    name: 'Default Staff',
                    email: 'staff@carrental.com',
                    password: 'staff123',
                    role: 'staff',
                    contact: '',
                    address: '',
                    id_image: ''
                });
            }

            localStorage.setItem('users', JSON.stringify(users));

            if (!localStorage.getItem('cars')) {
                localStorage.setItem('cars', JSON.stringify([]));
            }
            if (!localStorage.getItem('rentals')) {
                localStorage.setItem('rentals', JSON.stringify([]));
            }
        }

        // Execute initialization immediately
        initStorage();

        // --- STATE MANAGEMENT ---
        function getCurrentUser() {
            try {
                const userStr = sessionStorage.getItem('current_user');
                return userStr ? JSON.parse(userStr) : null;
            } catch (e) {
                return null;
            }
        }

        function setCurrentUser(user) {
            if (user) {
                sessionStorage.setItem('current_user', JSON.stringify(user));
            } else {
                sessionStorage.removeItem('current_user');
            }
        }

        function showAlert(message, category = 'success') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${category} alert-dismissible fade show rounded-3 shadow-sm mb-4" role="alert">
                    <i class="fa-solid fa-circle-info me-2"></i> ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            `;
        }

        // --- NAVIGATION ROUTER ---
        let currentViewParams = {};

        function navigateTo(page, params = {}) {
            currentViewParams = params;
            const user = getCurrentUser();

            // Handle root routing based on auth
            if (page === 'welcome' && user) {
                if (user.role === 'admin') page = 'admin';
                else if (user.role === 'staff') page = 'staff';
                else page = 'user';
            }

            renderNavbar();
            renderPage(page, params);
        }

        // --- RENDER NAVBAR ---
        function renderNavbar() {
            const user = getCurrentUser();
            const navSection = document.getElementById('nav-user-section');
            if (user) {
                let profileBadge = user.role === 'user' 
                    ? `<a href="#" onclick="navigateTo('profile')" class="text-white me-3 badge bg-secondary px-3 py-2 text-decoration-none shadow-sm" title="View Profile"><i class="fa-solid fa-user-circle me-1"></i> ${user.name} (${capitalize(user.role)})</a>`
                    : `<span class="text-white me-3 badge bg-secondary px-3 py-2"><i class="fa-solid fa-user-circle me-1"></i> ${user.name} (${capitalize(user.role)})</span>`;
                
                navSection.innerHTML = `
                    <div class="d-flex align-items-center">
                        ${profileBadge}
                        <button onclick="logout()" class="btn btn-outline-danger btn-sm rounded-pill px-3"><i class="fa-solid fa-right-from-bracket me-1"></i> Logout</button>
                    </div>
                `;
            } else {
                navSection.innerHTML = '';
            }
        }

        function capitalize(str) {
            return str ? str.charAt(0).toUpperCase() + str.slice(1) : '';
        }

        // --- RENDER PAGES ---
        function renderPage(page, params = {}) {
            const view = document.getElementById('app-view');
            const user = getCurrentUser();

            switch(page) {
                case 'welcome':
                    view.innerHTML = `
                        <div class="hero-banner text-center my-4">
                            <h1 class="display-4 fw-bold mb-3"><i class="fa-solid fa-car me-2"></i> Welcome to DriveEase PH</h1>
                            <p class="lead text-light mb-4 fs-4">Your premium, fast, and effortless car rental booking system.</p>
                            <div class="d-flex justify-content-center gap-3">
                                <button onclick="navigateTo('login')" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fw-bold shadow"><i class="fa-solid fa-rocket me-2"></i> Get Started</button>
                                <button onclick="navigateTo('signup')" class="btn btn-outline-light btn-lg rounded-pill px-4 py-3 fw-bold"><i class="fa-solid fa-user-plus me-2"></i> Sign Up</button>
                            </div>
                        </div>
                        <div class="row text-center mt-5">
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-white card-custom">
                                    <i class="fa-solid fa-shield-halved text-primary display-5 mb-3"></i>
                                    <h4>Verified Renters</h4>
                                    <p class="text-muted">Secure ID verification process for peace of mind.</p>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-white card-custom">
                                    <i class="fa-solid fa-bolt text-warning display-5 mb-3"></i>
                                    <h4>Instant Billing</h4>
                                    <p class="text-muted">Automated total bill computation with instant e-tickets.</p>
                                </div>
                            </div>
                            <div class="col-md-4 mb-3">
                                <div class="p-4 bg-white card-custom">
                                    <i class="fa-solid fa-receipt text-success display-5 mb-3"></i>
                                    <h4>On-the-Spot Receipts</h4>
                                    <p class="text-muted">Present digital tickets on-site directly to the staff team.</p>
                                </div>
                            </div>
                        </div>`;
                    break;

                case 'login':
                    view.innerHTML = `
                        <div class="row justify-content-center my-5">
                            <div class="col-md-6 col-lg-5">
                                <div class="card card-custom p-4 bg-white">
                                    <h3 class="mb-4 text-center fw-bold text-dark"><i class="fa-solid fa-right-to-bracket text-primary me-2"></i>Account Login</h3>
                                    
                                    

                                    <form onsubmit="handleLogin(event)">
                                        <div class="mb-3">
                                            <label class="form-label fw-bold"><i class="fa-solid fa-envelope me-1"></i> Email Address</label>
                                            <input type="email" id="login-email" class="form-control py-2" placeholder="name@example.com" required>
                                        </div>
                                        <div class="mb-4">
                                            <label class="form-label fw-bold"><i class="fa-solid fa-lock me-1"></i> Password</label>
                                            <input type="password" id="login-password" class="form-control py-2" placeholder="••••••••" required>
                                        </div>
                                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-pill fw-bold shadow-sm mb-3"><i class="fa-solid fa-sign-in-alt me-2"></i> Login</button>
                                    </form>
                                    <div class="text-center">
                                        <p class="mb-0 text-muted">Don't have an account? <a href="#" onclick="navigateTo('signup')" class="fw-bold text-primary text-decoration-none">Sign Up Here</a></p>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    break;

                case 'signup':
                    view.innerHTML = `
                        <div class="row justify-content-center my-4">
                            <div class="col-md-6">
                                <div class="card card-custom p-4 bg-white">
                                    <h3 class="mb-3 text-center fw-bold text-primary"><i class="fa-solid fa-user-plus me-2"></i> Create Renter Account</h3>
                                    <form onsubmit="handleSignup(event)">
                                        <div class="mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-user me-1"></i> Full Name</label><input type="text" id="signup-name" class="form-control" required></div>
                                        <div class="row">
                                            <div class="col-md-6 mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-phone me-1"></i> Contact Number</label><input type="text" id="signup-contact" class="form-control" placeholder="09123456789" required></div>
                                            <div class="col-md-6 mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-envelope me-1"></i> Email Address</label><input type="email" id="signup-email" class="form-control" required></div>
                                        </div>
                                        <div class="mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-location-dot me-1"></i> Complete Address</label><input type="text" id="signup-address" class="form-control" required></div>
                                        <div class="mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-id-card me-1"></i> Upload Valid ID</label><input type="file" id="signup-id" class="form-control" accept="image/*" required></div>
                                        <div class="mb-3"><label class="form-label fw-bold"><i class="fa-solid fa-lock me-1"></i> Password</label><input type="password" id="signup-password" class="form-control" required></div>
                                        <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm"><i class="fa-solid fa-paper-plane me-2"></i> Register Account</button>
                                    </form>
                                    <p class="mt-3 text-center text-muted">Already registered? <a href="#" onclick="navigateTo('login')" class="fw-bold text-decoration-none">Login</a></p>
                                </div>
                            </div>
                        </div>`;
                    break;

                case 'admin':
                    if (!user || user.role !== 'admin') { navigateTo('login'); return; }
                    renderAdminDashboard(params);
                    break;

                case 'staff':
                    if (!user || user.role !== 'staff') { navigateTo('login'); return; }
                    renderStaffDashboard();
                    break;

                case 'user':
                    if (!user || user.role !== 'user') { navigateTo('login'); return; }
                    renderUserDashboard(params);
                    break;

                case 'receipt':
                    renderReceipt(params.rental_id);
                    break;

                case 'profile':
                    if (!user) { navigateTo('login'); return; }
                    renderProfile();
                    break;
            }
        }

        // --- AUTH CONTROLLERS ---
        function handleLogin(e) {
            e.preventDefault();
            initStorage();

            const inputEmail = document.getElementById('login-email').value.trim().toLowerCase();
            const inputPassword = document.getElementById('login-password').value.trim();

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const found = users.find(u => u.email.trim().toLowerCase() === inputEmail && u.password.trim() === inputPassword);

            if (found) {
                setCurrentUser(found);
                showAlert('Login successful! Welcome back, ' + found.name + '!', 'success');
                navigateTo('welcome');
            } else {
                showAlert('Invalid email or password.', 'danger');
            }
        }

        function handleSignup(e) {
            e.preventDefault();
            initStorage();

            const name = document.getElementById('signup-name').value.trim();
            const contact = document.getElementById('signup-contact').value.trim();
            const email = document.getElementById('signup-email').value.trim().toLowerCase();
            const address = document.getElementById('signup-address').value.trim();
            const password = document.getElementById('signup-password').value.trim();
            const idFile = document.getElementById('signup-id').files[0];

            let users = JSON.parse(localStorage.getItem('users')) || [];
            if (users.some(u => u.email.trim().toLowerCase() === email)) {
                showAlert('Email already registered.', 'danger');
                return;
            }

            const saveNewUser = (idImage) => {
                const newUser = {
                    id: 'user_' + Date.now(),
                    name, contact, email, address, password,
                    id_image: idImage,
                    role: 'user'
                };
                users.push(newUser);
                localStorage.setItem('users', JSON.stringify(users));
                showAlert('Registration successful! Please log in.', 'success');
                navigateTo('login');
            };

            if (idFile) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    saveNewUser(uploadEvent.target.result);
                };
                reader.readAsDataURL(idFile);
            } else {
                saveNewUser('');
            }
        }

        function logout() {
            setCurrentUser(null);
            navigateTo('welcome');
        }

        // --- ADMIN DASHBOARD LOGIC ---
        function renderAdminDashboard(params) {
            const showAccounts = params.show_accounts === 'true';
            const showFeedback = params.show_feedback === 'true';

            const users = JSON.parse(localStorage.getItem('users')) || [];
            const cars = JSON.parse(localStorage.getItem('cars')) || [];
            const rentals = JSON.parse(localStorage.getItem('rentals')) || [];

            const allAccounts = users.filter(u => u.role !== 'admin');
            const totalCars = cars.length;
            const rentedCars = cars.filter(c => c.status === 'Rented').length;
            const availableCars = totalCars - rentedCars;

            let totalRevenue = 0;
            let recentFeedbacks = [];
            rentals.forEach(r => {
                totalRevenue += parseFloat(r.total_bill || 0);
                if (r.status === 'Completed' && r.comment) {
                    recentFeedbacks.push(r);
                }
            });

            const view = document.getElementById('app-view');
            view.innerHTML = `
                <div class="p-4 mb-4 bg-white rounded-4 shadow-sm border-start border-primary border-5 d-flex justify-content-between align-items-center">
                    <div>
                        <h2 class="fw-bold text-dark mb-1"><i class="fa-solid fa-user-gear text-primary me-2"></i> Admin Management Center</h2>
                        <p class="text-muted mb-0 small">Welcome back! Monitor system statistics, track revenue, and oversee user or staff accounts securely.</p>
                    </div>
                    <div class="d-none d-md-block">
                        <span class="badge bg-light text-dark border px-3 py-2 rounded-pill"><i class="fa-solid fa-shield-halved text-success me-1"></i> Secure Admin Access</span>
                    </div>
                </div>

                <!-- METRICS CARDS -->
                <div class="row mb-4">
                    <div class="col-md-3 mb-3 mb-md-0">
                        <div class="card card-custom p-3 bg-white border-start border-primary border-4 shadow-sm">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <span class="text-muted small fw-bold">TOTAL CARS</span>
                                    <h3 class="mb-0 fw-bold text-dark">${totalCars}</h3>
                                </div>
                                <div class="bg-primary bg-opacity-10 p-3 rounded-circle text-primary"><i class="fa-solid fa-car fs-4"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3 mb-md-0">
                        <div class="card card-custom p-3 bg-white border-start border-success border-4 shadow-sm">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <span class="text-muted small fw-bold">AVAILABLE</span>
                                    <h3 class="mb-0 fw-bold text-success">${availableCars}</h3>
                                </div>
                                <div class="bg-success bg-opacity-10 p-3 rounded-circle text-success"><i class="fa-solid fa-circle-check fs-4"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3 mb-3 mb-md-0">
                        <div class="card card-custom p-3 bg-white border-start border-warning border-4 shadow-sm">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <span class="text-muted small fw-bold">RENTED</span>
                                    <h3 class="mb-0 fw-bold text-warning">${rentedCars}</h3>
                                </div>
                                <div class="bg-warning bg-opacity-10 p-3 rounded-circle text-warning"><i class="fa-solid fa-key fs-4"></i></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card card-custom p-3 bg-white border-start border-info border-4 shadow-sm">
                            <div class="d-flex align-items-center justify-content-between">
                                <div>
                                    <span class="text-muted small fw-bold">TOTAL REVENUE</span>
                                    <h3 class="mb-0 fw-bold text-info">₱${totalRevenue.toFixed(2)}</h3>
                                </div>
                                <div class="bg-info bg-opacity-10 p-3 rounded-circle text-info"><i class="fa-solid fa-money-bill-wave fs-4"></i></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- FEEDBACK TOGGLE -->
                <div class="card card-custom p-4 bg-white mb-4 shadow-sm">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                        <div>
                            <h5 class="fw-bold mb-1"><i class="fa-solid fa-comments text-primary me-2"></i> Renter Feedback & Return Logs</h5>
                            <p class="text-muted small mb-0">Click the button to view ratings, feedback, and reasons why cars were returned.</p>
                        </div>
                        <div>
                            <button onclick="navigateTo('admin', {show_feedback: '${!showFeedback}', show_accounts: '${showAccounts}'})" class="btn ${showFeedback ? 'btn-outline-secondary' : 'btn-primary'} rounded-pill px-4 fw-bold shadow-sm">
                                <i class="fa-solid ${showFeedback ? 'fa-eye-slash' : 'fa-comments'} me-2"></i> ${showFeedback ? 'Hide Feedback Logs' : 'View Renter Feedback & Logs'}
                            </button>
                        </div>
                    </div>
                </div>

                ${showFeedback ? `
                <div class="card card-custom p-4 bg-white mb-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-comments me-2 text-primary"></i> Renter Feedback & Return Logs</h4>
                        <span class="badge bg-secondary rounded-pill">Total: ${recentFeedbacks.length}</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr><th>Renter Name</th><th>Car Model</th><th>Rental Period</th><th>Rating</th><th>Return Reason / Feedback</th></tr>
                            </thead>
                            <tbody>
                                ${recentFeedbacks.length === 0 ? `<tr><td colspan="5" class="text-center text-muted py-3">No return feedback recorded yet.</td></tr>` : 
                                  recentFeedbacks.map(fb => `
                                    <tr>
                                        <td><strong>${fb.user_name}</strong></td>
                                        <td>${fb.car_model}</td>
                                        <td><small>${fb.start_date} to ${fb.return_date}</small></td>
                                        <td><span class="badge bg-warning text-dark">⭐ ${fb.rating}/5</span></td>
                                        <td><span class="text-dark">${fb.comment}</span></td>
                                    </tr>
                                  `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>` : ''}

                <!-- ACCOUNTS TOGGLE -->
                <div class="card card-custom p-4 bg-white mb-4 shadow-sm">
                    <div class="d-flex flex-column flex-md-row justify-content-between align-items-center gap-3">
                        <div>
                            <h5 class="fw-bold mb-1"><i class="fa-solid fa-address-book text-primary me-2"></i> User & Staff Directory</h5>
                            <p class="text-muted small mb-0">Click the button to view, manage, or edit credentials of registered users and staff members.</p>
                        </div>
                        <div>
                            <button onclick="navigateTo('admin', {show_feedback: '${showFeedback}', show_accounts: '${!showAccounts}'})" class="btn ${showAccounts ? 'btn-outline-secondary' : 'btn-primary'} rounded-pill px-4 fw-bold shadow-sm">
                                <i class="fa-solid ${showAccounts ? 'fa-eye-slash' : 'fa-users-gear'} me-2"></i> ${showAccounts ? 'Hide Accounts List' : 'Manage Users & Staff Accounts'}
                            </button>
                        </div>
                    </div>
                </div>

                ${showAccounts ? `
                <div class="card card-custom p-4 bg-white mb-4 shadow-sm">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0 fw-bold text-dark"><i class="fa-solid fa-users me-2 text-primary"></i> Registered Accounts</h4>
                        <span class="badge bg-secondary rounded-pill">Total: ${allAccounts.length}</span>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-dark">
                                <tr><th>Role</th><th>Name</th><th>Email</th><th>Contact / Address</th><th>ID Card</th><th>Actions</th></tr>
                            </thead>
                            <tbody>
                                ${allAccounts.map(u => `
                                    <tr>
                                        <td>${u.role === 'staff' ? '<span class="badge bg-warning text-dark"><i class="fa-solid fa-user-shield me-1"></i> Staff</span>' : '<span class="badge bg-info text-dark"><i class="fa-solid fa-user me-1"></i> Renter</span>'}</td>
                                        <td><strong>${u.name}</strong></td>
                                        <td>${u.email}</td>
                                        <td>${u.role === 'user' ? `<small>${u.contact || 'N/A'}<br>${u.address || 'N/A'}</small>` : '<span class="text-muted">N/A</span>'}</td>
                                        <td>${u.id_image ? `<a href="${u.id_image}" target="_blank" class="btn btn-sm btn-outline-primary rounded-pill"><i class="fa-solid fa-image me-1"></i> View ID</a>` : '<span class="text-muted small">No ID Uploaded</span>'}</td>
                                        <td><button class="btn btn-sm btn-warning rounded-pill px-3 fw-bold" data-bs-toggle="modal" data-bs-target="#editUserModal${u.id}"><i class="fa-solid fa-pen-to-square me-1"></i> Edit</button></td>
                                    </tr>

                                    <!-- EDIT USER MODAL -->
                                    <div class="modal fade" id="editUserModal${u.id}" tabindex="-1" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content rounded-4 border-0 shadow">
                                                <form onsubmit="handleEditAccount(event, '${u.id}')">
                                                    <div class="modal-header bg-dark text-white rounded-top-4">

        function handleAddCar(e) {
            e.preventDefault();
            const model = document.getElementById('car-model').value.trim();
            const price = parseFloat(document.getElementById('car-price').value);
            const imageFiles = document.getElementById('car-images').files;

            let imageReaderCount = 0;
            let imageFilenames = [];

            Array.from(imageFiles).forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    imageFilenames[index] = evt.target.result;
                    imageReaderCount++;
                    if (imageReaderCount === imageFiles.length) {
                        saveCarToStorage(model, price, imageFilenames);
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function saveCarToStorage(model, price, images) {
            const cars = JSON.parse(localStorage.getItem('cars')) || [];
            const newCar = {
                id: 'car_' + Date.now(),
                model,
                price,
                image: images[0] || '',
                images: images,
                status: 'Available'
            };
            cars.push(newCar);
            localStorage.setItem('cars', JSON.stringify(cars));
            showAlert('Car and damage inspection album added successfully!', 'success');
            renderStaffDashboard();
        }

        function deleteCar(carId) {
            if (!confirm('Are you sure you want to delete this car?')) return;
            let cars = JSON.parse(localStorage.getItem('cars')) || [];
            cars = cars.filter(c => c.id !== carId);
            localStorage.setItem('cars', JSON.stringify(cars));
            showAlert('Car deleted successfully!', 'success');
            renderStaffDashboard();
        }

        function handleRentCar(e, carId) {
            e.preventDefault();
            const user = getCurrentUser();
            const rentals = JSON.parse(localStorage.getItem('rentals')) || [];

            if (rentals.some(r => r.user_id === user.id && r.status === 'Active')) {
                showAlert('You currently have an active rental. You must return your current car before renting again.', 'danger');
                return;
            }

            const startDateStr = document.getElementById(`start_${carId}`).value;
            const returnDateStr = document.getElementById(`return_${carId}`).value;

            const startDate = new Date(startDateStr);
            const returnDate = new Date(returnDateStr);
            const rentalDays = Math.ceil((returnDate - startDate) / (1000 * 60 * 60 * 24));

            if (rentalDays <= 0) {
                showAlert('Return date must be after the start date.', 'danger');
                return;
            }

            const cars = JSON.parse(localStorage.getItem('cars')) || [];
            const car = cars.find(c => c.id === carId);
            if (!car) {
                showAlert('Selected car not found.', 'danger');
                return;
            }

            const totalBill = rentalDays * car.price;
            const rentalId = 'rental_' + Date.now();

            const newRental = {
                id: rentalId,
                user_id: user.id,
                user_name: user.name,
                car_id: carId,
                car_model: car.model,
                start_date: startDateStr,
                return_date: returnDateStr,
                days: rentalDays,
                total_bill: totalBill,
                status: 'Active'
            };

            rentals.push(newRental);
            localStorage.setItem('rentals', JSON.stringify(rentals));

            const updatedCars = cars.map(c => c.id === carId ? { ...c, status: 'Rented' } : c);
            localStorage.setItem('cars', JSON.stringify(updatedCars));

            navigateTo('receipt', { rental_id: rentalId });
        }

        function handleReturnCar(e, rentalId) {
            e.preventDefault();
            const rating = document.getElementById('return-rating').value;
            const comment = document.getElementById('return-comment').value.trim();

            let rentals = JSON.parse(localStorage.getItem('rentals')) || [];
            let targetRental = rentals.find(r => r.id === rentalId);
            if (!targetRental) {
                showAlert('Rental record not found.', 'danger');
                return;
            }

            rentals = rentals.map(r => r.id === rentalId ? { ...r, status: 'Completed', rating, comment } : r);
            localStorage.setItem('rentals', JSON.stringify(rentals));

            let cars = JSON.parse(localStorage.getItem('cars')) || [];
            cars = cars.map(c => c.id === targetRental.car_id ? { ...c, status: 'Available' } : c);
            localStorage.setItem('cars', JSON.stringify(cars));

            showAlert('Vehicle successfully returned! Thank you for your feedback.', 'success');
            navigateTo('user');
        }

        // Initialize App on Load
        window.onload = function() {
            initStorage();
